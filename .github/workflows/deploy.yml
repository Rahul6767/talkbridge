# Owner: Rahul (B). Adapted from skyhook-io/cnh-starter.
# On every merge to main: build the image, push it to GHCR, then publish k8s/
# with that exact image tag to the "deploy" branch. Argo CD watches "deploy".
# Why a separate branch: main is protected (PR + checks required), and the
# workflow's GITHUB_TOKEN cannot bypass that ruleset; "deploy" holds only
# generated manifests, so every human change still goes through a reviewed PR.
name: build-and-deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Publish manifests to the deploy branch
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          out="$RUNNER_TEMP/k8s"
          cp -r k8s "$out"
          yq -i '(.images[] | select(.name == "app")) |= (.newName = strenv(IMAGE) | .newTag = strenv(TAG))' "$out/kustomization.yaml"
          if git fetch -q origin deploy; then
            git checkout -q -B deploy FETCH_HEAD
          else
            git checkout -q --orphan deploy
            git rm -rfq .
          fi
          rm -rf k8s && cp -r "$out" k8s
          git add -A k8s
          if git diff --cached --quiet; then echo "No manifest changes."; exit 0; fi
          git commit -qm "deploy: ${TAG} (from ${GITHUB_SHA::7} on main)"
          git push -q origin deploy
